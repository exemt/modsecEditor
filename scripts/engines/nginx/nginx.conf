# Самая малая конфигурация nginx, в которой живёт ModSecurity 3.
# `@RULES@` стенд заменяет путём к файлу правил.
#
# Ответ отдаётся файлом, а не директивой `return`: та срабатывает раньше,
# чем ModSecurity получает запрос, и правила при ней не исполняются вовсе.

load_module modules/ngx_http_modsecurity_module.so;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        modsecurity on;
        modsecurity_rules_file @RULES@;

        location / {
            try_files $uri /index.html;
        }
    }
}
