# probe: c6-variable-case
SecRule args "@rx a" "id:1,phase:2,pass,nolog"

# probe: c7-directive-case
secrule ARGS "@rx a" "id:1,phase:2,pass,nolog"

# probe: d1-unquoted-value-space
