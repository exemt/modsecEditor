# Пробы для стенда: записи, о которых у движков разное мнение.
#
# Каждый блок начинается строкой `# probe: имя` и тянется до следующей такой
# строки. Стенд (`scripts/engines/run.mjs`) грузит каждый блок отдельным
# файлом в ModSecurity 2, ModSecurity 3 и Coraza и записывает, кто из них
# согласился; `stand.test.ts` сверяет с этими вердиктами то, что о блоке
# сказал линтер.
#
# В отличие от `cases/*.conf`, здесь нет пометок о том, что линтер обязан
# сказать: вопрос не «какое замечание», а «загрузит ли это движок». Блоки
# нарочно крошечные — одна мысль на блок, чтобы отказ движка нельзя было
# списать на что-то ещё.

# probe: b1-quoted-variables
SecRule "ARGS" "@rx a" "id:1,phase:2,pass,nolog"

# probe: b2-quoted-variables-selector
SecRule "ARGS:'my param'" "@rx a" "id:1,phase:2,pass,nolog"

# probe: b3-unquoted-selector-quotes
SecRule ARGS:'/^a_/' "@rx a" "id:1,phase:2,pass,nolog"

# probe: c1-operator-upper
