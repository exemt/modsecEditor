# Правила глазами Coraza.
#
# options: {"engine":"coraza","codes":{"blockWithoutMsg":"off","noNormalisation":"off"}}
#
# Формат тот же, что в `findings.conf`; строка выше включает проверку
# совместимости с движком. Coraza понимает тот же язык, но не весь: списки
# того, что она знает, взяты из её исходников (`engines.ts`), а шаблоны она
# считает регулярными выражениями Go, в которых нет просмотров, обратных
# ссылок и запрета возврата.

# expect: -
# Обычное правило — и собственные имена Coraza, которых нет в ModSecurity.
SecRule ARGS "@rx (?i)\bunion\b[\s\x0b]+select" "id:30001,phase:2,deny,status:403,t:none,t:urlDecodeUni,log,msg:'SQLi'"
SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" "id:30002,phase:1,deny,status:400,log,msg:'Too many arguments'"
SecRule REQUEST_URI "@restpath /api/users/{id}" "id:30003,phase:1,pass,nolog"
SecResponseBodyJsonDepthLimit 512

# expect: notInEngine
# Оператора в Coraza нет.
SecRule ARGS "@containsWord select" "id:30010,phase:2,deny"

# expect: notInEngine
SecRule ARGS:card "@verifyCC \d{13,16}" "id:30011,phase:2,deny"

# expect: notInEngine notInEngine
# Очистку журнала и остановку ответа Coraza не делает.
SecRule ARGS:password "@rx ." "id:30012,phase:2,pass,nolog,sanitiseMatched,pause:500"

# expect: notInEngine
# Преобразование есть в ModSecurity, но не здесь.
SecRule ARGS "@rx ^0x[0-9a-f]+$" "id:30013,phase:2,deny,t:none,t:sqlHexDecode"

# expect: notInEngine
# Переменная сервера Apache.
SecRule WEBSERVER_ERROR_LOG "@rx ^File does not exist" "id:30014,phase:5,pass,log"

# expect: notInEngine
# Директива ModSecurity; у Coraza она называется SecUnicodeMap.
SecUnicodeMapFile unicode.mapping 20127

# expect: notInEngine notInEngine notInEngine notInEngine
# Долгоживущих коллекций в Coraza нет: ни действия, ни записи, ни чтения.
# Нет и REMOTE_USER — а макрос с незнакомой переменной Coraza не грузит.
SecAction "id:30015,phase:1,pass,nolog,setuid:%{REMOTE_USER},setvar:user.attempts=+1"
SecRule USER:attempts "@gt 5" "id:30016,phase:1,deny"

# expect: regexNotInEngine
# Просмотр вперёд: в регулярных выражениях Go его нет.
SecRule REQUEST_HEADERS:Content-Type "@rx ^(?!application/json)" "id:30020,phase:1,deny"

# expect: regexNotInEngine
# Просмотр назад.
SecRule REQUEST_URI "@rx (?<!\.)\.php$" "id:30021,phase:1,deny"

# expect: regexNotInEngine
# Обратная ссылка.
SecRule ARGS "@rx (['\"])[^'\"]*\1" "id:30022,phase:2,deny"

# expect: regexNotInEngine
# Запрет возврата: сверхжадный квантор и атомарная группа.
SecRule ARGS "@rx ^(?>a+)b*+c" "id:30023,phase:2,deny"

# expect: -
# То же самое внутри класса символов или после слэша — обычные знаки.
SecRule ARGS "@rx [(?=!<]+\(\?=x\)\\1" "id:30024,phase:2,deny"

# expect: macroNotExpanded regexNotInEngine
# Макрос в шаблоне Coraza не раскрывает: шаблон собирается при загрузке как
# написан — вместе с `%{tx.allowed}` и с просмотром вперёд.
SecRule ARGS "@rx ^%{tx.allowed}(?!x)" "id:30025,phase:2,deny,setvar:tx.allowed=a"

# expect: -
# В сравнении строк макрос раскрывается и у Coraza.
SecRule ARGS "@streq %{tx.allowed}" "id:30026,phase:2,deny,t:lowercase,setvar:tx.allowed=a"

# expect: operatorCase operatorCase
# ModSecurity имена операторов сравнивает без учёта регистра, Coraza — нет.
SecRule ARGS "@RX ^attack" "id:30027,phase:2,deny"
SecRule REQUEST_URI "@beginswith /admin" "id:30028,phase:1,deny,t:lowercase"

# expect: notInEngine
# Записывать Coraza умеет только в TX.
SecAction "id:30029,phase:1,pass,nolog,initcol:global=global,setvar:global.hits=+1"

# expect: regexNotInEngine
# Шаблон бывает и у директивы — эта строка из рекомендованной конфигурации
# ModSecurity.
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
