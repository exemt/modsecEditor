# Набор из нескольких файлов: то, что читается раньше правил.
#
# Файлы этой папки проверяются вместе, в порядке имён — так, как их
# подключил бы `Include workspace/*.conf`. Формат пометок тот же, что в
# `findings.conf`. Примеры здесь о том, чего в одном файле не увидеть:
# метка, умолчания и переменная живут в одном файле, а нужны в другом.

# expect: -
# Умолчания и настройка: ими пользуются правила следующего файла.
SecDefaultAction "phase:2,log,auditlog,deny,status:403"
SecAction "id:43000,phase:1,pass,nolog,setvar:tx.threshold=5"

# expect: -
# Переход вперёд: метка стоит в следующем файле.
SecRule REQUEST_URI "@beginsWith /static/" \
    "id:43010,phase:1,pass,nolog,t:none,t:urlDecodeUni,skipAfter:END-APP-CHECKS"

# expect: -
# Исключение на время запроса: ему место здесь, перед правилами.
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:43011,phase:1,pass,nolog,t:none,t:urlDecodeUni,ctl:ruleRemoveById=43002"

# expect: exclusionInEarlierFile
# А директиве — нет: правило ещё не прочитано, и снимать ей нечего.
SecRuleRemoveById 43001
