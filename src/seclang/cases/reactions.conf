# Действия и аргументы: что в них написано и чем правило отвечает.
#
# Формат тот же, что в `findings.conf`, но без выключенных советов: здесь у
# правил есть и реакция, и сообщение — кроме тех блоков, где показано, что
# будет без них.

# expect: -
# Настройка: переменная, которую читают примеры ниже.
SecAction "id:40000,phase:1,pass,nolog,setvar:tx.limit=5"

# ---------------------------------------------------------------------
# Значения действий
# ---------------------------------------------------------------------

# expect: invalidActionValue
# Фазы с таким номером нет: правило некуда положить.
SecRule ARGS "@rx ^a1" "id:40001,phase:9,pass"

# expect: invalidActionValue
# Номер правила — только цифры и больше нуля.
SecRule ARGS "@rx ^a2" "id:abc,phase:2,pass"

# expect: suspiciousActionValue suspiciousActionValue
# Незнакомая критичность читается как «авария», код ответа — как ноль.
SecRule ARGS "@rx ^a3" "id:40003,phase:2,deny,status:abc,severity:banana,msg:'Blocked'"

# expect: suspiciousActionValue
# В GEO пишет только движок: запись принимается и ничего не делает.
SecAction "id:40004,phase:1,pass,nolog,setvar:geo.country=RU"

# expect: suspiciousActionValue
# У initcol нет ключа коллекции: вторая версия такое загрузит и споткнётся
# на запросе, остальные откажутся сразу.
SecAction "id:40005,phase:1,pass,nolog,initcol:ip"

# expect: unknownCtl
SecRule ARGS "@rx ^a6" "id:40006,phase:2,pass,ctl:ruleEngin=Off"

# expect: invalidActionValue
# Опция знакома, значение — нет.
SecRule ARGS "@rx ^a7" "id:40007,phase:2,pass,ctl:ruleEngine=Maybe"

# expect: duplicateAction
SecRule ARGS "@rx ^a8" "id:40008,phase:2,pass,nolog,nolog"

# expect: conflictingActions
# Из двух реакций движок оставит последнюю.
SecRule ARGS "@rx ^a9" "id:40009,phase:2,deny,pass,msg:'Blocked'"

# ---------------------------------------------------------------------
# Макросы
# ---------------------------------------------------------------------

# expect: unknownMacro unknownMacro
# Опечатка в имени переменной и в поле RULE.
SecRule ARGS "@rx ^b1" "id:40010,phase:2,pass,log,msg:'%{REMOTE_ADR}',logdata:'%{rule.mgs}'"

# expect: macroNotExpanded
# @pm читает список один раз, при загрузке: макрос для него — просто текст.
SecRule ARGS "@pm admin %{tx.limit}" "id:40011,phase:2,pass"

# expect: macroInStaticAction
# Метку движок читает при загрузке: искать он будет метку с именем
# `%{tx.limit}`, не найдёт — и пропустит всё, что осталось в фазе.
SecAction "id:40041,phase:1,pass,nolog,skipAfter:%{tx.limit}"

# expect: macroKeySeparator
# В области проверки параметр стоит после двоеточия, в макросе — после точки.
SecRule ARGS "@rx ^b5" "id:40042,phase:2,pass,log,msg:'Host is %{REQUEST_HEADERS:Host}'"

# expect: commentSwallowsLine
# Фраза, случайно кончившаяся обратным слэшем \
SecRule ARGS "@rx ^b3" "id:40012,phase:2,pass"

# ---------------------------------------------------------------------
# Кавычки и переносы
# ---------------------------------------------------------------------

# expect: unclosedValueQuote
# Кавычка у msg не закрыта: значение тянется до конца списка действий.
SecRule ARGS "@rx ^g1" "id:40043,phase:2,pass,msg:'Unclosed,tag:one"

# expect: textAfterQuote
# Запятая потерялась: значение кончилось на кавычке, а за ней ещё текст.
SecRule ARGS "@rx ^g0" "id:40052,phase:2,pass,msg:'First'tag:'one'"

# expect: invalidQuotedPair
# Внутри одинарных кавычек `\` стоит только перед кавычкой или перед `\`.
SecRule ARGS "@rx ^g2" "id:40044,phase:2,pass,log,msg:'Path c:\temp'"

# expect: -
# Три слэша — не опечатка: первый слой разбора сворачивает `\\` в `\`, и
# до движка доходит ровно `\d`. Так записано в CRS.
SecRule TX:'/^\\\d+_score$/' "@gt 0" "id:40045,phase:2,pass"

# expect: continuationSpace
# После обратного слэша стоит пробел: для движка строка на этом кончилась.
# (Пробел в конце следующей строки — и есть пример; не убирайте его.)
SecRule ARGS "@rx ^g3" \ 
    "id:40051,phase:2,pass"

# expect: operatorReadAsPattern
# Пробел перед `@`: имя оператора движок ищет сразу за кавычкой.
SecRule ARGS " @contains admin" "id:40046,phase:2,pass,t:lowercase"

# ---------------------------------------------------------------------
# Реакция и журнал
# ---------------------------------------------------------------------

# expect: noDisruptive
SecRule ARGS "@rx ^c1" "id:40013,phase:2,log,msg:'No reaction'"

# expect: statusWithoutBlock
# Код ответа рядом с pass: отвечать им некому.
SecRule ARGS "@rx ^c2" "id:40014,phase:2,pass,status:404"

# expect: disruptiveInLoggingPhase
# В пятой фазе ответ уже ушёл.
SecRule ARGS "@rx ^c3" "id:40015,phase:5,deny,msg:'Too late'"

# expect: blockWithoutLog
SecRule ARGS "@rx ^c4" "id:40016,phase:2,deny,nolog,msg:'Silent block'"

# expect: logdataWithoutLog
SecRule ARGS "@rx ^c5" "id:40017,phase:2,pass,nolog,logdata:'%{MATCHED_VAR}'"

# expect: blockWithoutMsg
SecRule ARGS "@rx ^c6" "id:40018,phase:2,deny"

# expect: captureWithoutRegex
# @streq ничего не захватывает ни в одном движке: %{TX.0} останется пустым.
SecRule ARGS "@streq admin" "id:40019,phase:2,pass,capture,t:lowercase,logdata:'%{TX.0}'"

# expect: captureUnused
SecRule ARGS "@rx ^(c8)" "id:40020,phase:2,pass,capture"

# expect: setvarInChainHead
# Действия головы исполняются, как только совпало первое условие.
SecRule ARGS "@rx ^h1" "id:40047,phase:2,pass,setvar:tx.limit=+1,chain"
    SecRule REQUEST_METHOD "@rx ^P"

# expect: idInReservedRange
# Диапазон 900000–999999 занят CRS.
SecRule ARGS "@rx ^c9" "id:942999,phase:2,pass"

# ---------------------------------------------------------------------
# Аргументы операторов
# ---------------------------------------------------------------------

# expect: invalidIpEntry
SecRule REMOTE_ADDR "@ipMatch 10.0.0.300,192.168.1.0/24" "id:40021,phase:1,pass"

# expect: invalidByteRange
SecRule ARGS "@validateByteRange 32-126,300" "id:40022,phase:2,pass"

# expect: literalWithRegexSyntax
# @contains ищет буквально: шаблон здесь — просто набор символов.
SecRule ARGS "@contains ^admin.*" "id:40023,phase:2,pass,t:lowercase"

# expect: alwaysTrueComparison
# Количество не бывает отрицательным.
SecRule &ARGS "@ge 0" "id:40024,phase:2,pass"

# expect: neverTrueComparison
SecRule ARGS "@lt 0" "id:40025,phase:2,pass,t:length"

# expect: impossibleNumericRange
# Звенья соединены по «и»: больше десяти и меньше пяти одновременно.
SecRule &ARGS "@gt 10" "id:40026,phase:2,pass,chain"
    SecRule &ARGS "@lt 5"

# expect: noNormalisation
# Буквальное сравнение с тем, что прислал клиент, — без единого преобразования.
SecRule ARGS "@contains admin" "id:40027,phase:2,pass"

# expect: rblOnHotPath
SecRule REMOTE_ADDR "@rbl sbl-xbl.spamhaus.org" "id:40028,phase:1,pass"

# expect: singlePhraseList
SecRule ARGS "@pm admin" "id:40029,phase:2,pass"

# expect: caseBeforeBase64
# Base64 различает регистр: после t:lowercase раскодируется мусор.
SecRule ARGS "@rx ^i1" "id:40048,phase:2,pass,t:none,t:lowercase,t:base64Decode"

# expect: validateAfterDecode
SecRule REQUEST_URI "@validateUrlEncoding" "id:40049,phase:1,pass,t:none,t:urlDecodeUni"

# expect: validateDecodedInput
# Параметры движок уже раскодировал: верное `%25zz` дойдёт сюда как `%zz`.
SecRule ARGS "@validateUrlEncoding" "id:40076,phase:2,pass"

# expect: geoLookupWithoutDb
# Оператору нужна база, а SecGeoLookupDb в наборе нет.
SecRule REMOTE_ADDR "@geoLookup" "id:40050,phase:1,pass"

# expect: lookbehindNotFixed
# JavaScript такой шаблон принимает, PCRE — нет.
SecRule ARGS "@rx (?<=a+)b" "id:40030,phase:2,pass"

# ---------------------------------------------------------------------
# Области проверки
# ---------------------------------------------------------------------

# expect: overlappingTargets
SecRule ARGS|ARGS_GET "@rx ^d1" "id:40031,phase:2,pass"

# expect: excludeWithoutBase
# Cookie вычитаются из списка, в котором их нет.
SecRule ARGS|!REQUEST_COOKIES:session "@rx ^d2" "id:40032,phase:2,pass"

# expect: selectorNeedsQuotes
# Имя с пробелом: в кавычках его читает только вторая версия движка, а
# список областей с пробелом внутри обязан целиком стоять в двойных.
SecRule "ARGS:'my param'" "@rx ^d3" "id:40033,phase:2,pass"

# expect: selectorNotPortable
SecRule "ARGS:'it\'s'" "@rx ^d4" "id:40034,phase:2,pass"

# ---------------------------------------------------------------------
# Повторы
# ---------------------------------------------------------------------

# expect: duplicateCondition
SecRule ARGS "@rx ^e1" "id:40035,phase:2,pass,chain"
    SecRule ARGS "@rx ^e1"

# expect: duplicateRule
SecRule REQUEST_URI "@rx ^/e2" "id:40036,phase:1,pass"
SecRule REQUEST_URI "@rx ^/e2" "id:40037,phase:1,pass"

# ---------------------------------------------------------------------
# Пометки линтера
# ---------------------------------------------------------------------

# expect: unknownIgnoreCode unusedIgnore noNormalisation
# Опечатка в коде: пометка ничего не сняла, и замечание осталось.
# seclang-ignore: noNormalization
SecRule ARGS "@contains root" "id:40038,phase:2,pass"

# expect: unusedIgnore
# Снимать здесь нечего.
# seclang-ignore: caseNeverMatches
SecRule ARGS "@rx ^f2" "id:40039,phase:2,pass"

# ---------------------------------------------------------------------
# Запись, которую движки читают по-разному
#
# Всё в этом разделе вторая версия движка загружает. Третья версия или
# Coraza — нет, либо читают иначе; проверено на самих движках.
# ---------------------------------------------------------------------

# expect: unquotedArgument
# Список действий без кавычек: так умеет только вторая версия.
SecRule ARGS "@rx ^j1" id:40060,phase:2,pass

# expect: unquotedArgument
# Одинарные кавычки вокруг аргументов — тоже только её.
SecRule ARGS '@rx ^j2' 'id:40061,phase:2,pass'

# expect: quotedTargets
# А список областей в кавычках не читает Coraza.
SecRule "ARGS|ARGS_NAMES" "@rx ^j3" "id:40062,phase:2,pass"

# expect: emptyTarget
# Две черты подряд не грузит ни один движок.
SecRule ARGS||ARGS_NAMES "@rx ^j4" "id:40063,phase:2,pass"

# expect: emptyTarget
# Черту в конце списка не прощает третья версия.
SecRule ARGS| "@rx ^j5" "id:40064,phase:2,pass"

# expect: targetsCommaSeparated
# Запятую между областями ModSecurity читает как черту, Coraza — как часть имени.
SecRule ARGS,ARGS_NAMES "@rx ^j0" "id:40073,phase:2,pass"

# expect: suspiciousActionValue
# Запятая внутри кавычек у setvar: третья версия обрывает на ней действие.
SecAction "id:40074,phase:1,pass,nolog,setvar:'tx.note=first, second'"

# expect: suspiciousActionValue
# Свой обработчик тела запроса бывает только у второй версии.
SecAction "id:40075,phase:1,pass,nolog,ctl:requestBodyProcessor=PROTOBUF"

# expect: emptyAction
# Запятая в конце списка действий.
SecRule ARGS "@rx ^j6" "id:40065,phase:2,pass,"

# expect: unquotedValueBreak
# Без кавычек значение кончается на пробеле: `words` вторая версия примет
# за следующее действие — и такого действия не найдёт.
SecRule ARGS "@rx ^j7" "id:40066,phase:2,pass,log,msg:two words"

# expect: linkWithoutActions
# Звено без списка действий, а строка за ним не пуста: третья версия
# прочитает её как недостающие действия.
SecRule ARGS "@rx ^j8" "id:40067,phase:2,pass,chain"
    SecRule REQUEST_METHOD "@rx ^P"
SecRule ARGS "@rx ^j9" "id:40068,phase:2,pass"

# expect: -
# То же звено, за которым стоит пустая строка, грузят все.
SecRule ARGS "@rx ^k1" "id:40069,phase:2,pass,chain"
    SecRule REQUEST_METHOD "@rx ^P"

# expect: wideCodePoint
# ModSecurity собирает шаблон побайтово: символа с кодом выше \xff для него нет.
SecRule ARGS "@rx ^k2\x{20ac}" "id:40070,phase:2,pass"

# expect: backslashPair
# Два слэша: у второй версии это `\d`, цифра; у остальных — слэш и буква d.
SecRule ARGS "@rx ^k3\\d+$" "id:40071,phase:2,pass"

# expect: -
# Буквальный слэш, который все читают одинаково.
SecRule ARGS "@rx ^k4\x5c\d+$" "id:40072,phase:2,pass"

# ---------------------------------------------------------------------
# Умолчания. Стоят последними: действуют на всё, что ниже.
# ---------------------------------------------------------------------

# expect: defaultActionIncomplete defaultActionIncomplete defaultActionForbidden
# Ни фазы, ни реакции — зато номер, которого у умолчаний быть не может.
SecDefaultAction "log,id:5"

# expect: defaultActionDeprecated
# Преобразование из умолчаний ляжет на каждое правило ниже — молча.
SecDefaultAction "phase:2,log,pass,t:lowercase"
