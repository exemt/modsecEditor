# Файлы данных: существует ли то, на что ссылается правило.
#
# options: {"files":["sql-errors.data","blocklist.txt"]}
#
# Формат тот же, что в `findings.conf`. Линтер работает с текстом и о диске
# ничего не знает; строка выше перечисляет файлы, которые «есть». Из
# командной строки то же делается само: `scripts/seclang.mjs` смотрит на диск.

# expect: -
# Файл назван среди существующих.
SecRule RESPONSE_BODY "@pmFromFile sql-errors.data" "id:44001,phase:4,pass,t:none"
SecRule REMOTE_ADDR "@ipMatchFromFile blocklist.txt" "id:44002,phase:1,pass"

# expect: fileNotFound
# Опечатка в имени: такую конфигурацию движок не загрузит.
SecRule RESPONSE_BODY "@pmFromFile sql-erors.data" "id:44003,phase:4,pass,t:none"

# expect: fileNotFound
# Имён может быть несколько; нет — второго.
SecRule RESPONSE_BODY "@pmFromFile sql-errors.data php-errors.data" "id:44004,phase:4,pass,t:none"

# expect: -
# Адрес в сети — не файл на диске.
SecRule REMOTE_ADDR "@ipMatchFromFile https://example.com/blocklist.txt" "id:44005,phase:1,pass"

# expect: -
# Короткое имя оператора — тот же оператор.
SecRule RESPONSE_BODY "@pmf sql-errors.data" "id:44006,phase:4,pass,t:none"

# expect: fileNotFound
SecRule RESPONSE_BODY "@pmf web-shells.data" "id:44007,phase:4,pass,t:none"
