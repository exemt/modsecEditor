# Правила глазами ModSecurity 3.
#
# options: {"engine":"modsecurity3","codes":{"blockWithoutMsg":"off","noNormalisation":"off"}}
#
# Формат тот же, что в `findings.conf`; строка выше включает проверку
# совместимости с движком. Третья версия — не продолжение второй, а другая
# программа, и часть действий, операторов и директив в неё не перенесена.
# Что именно — взято из пометок «Supported on libModSecurity» официального
# справочника (`engines.ts`).

# expect: -
# Всё, чем пользуется CRS, третья версия понимает; шаблоны она считает
# через PCRE, так что просмотры и обратные ссылки — не помеха.
SecRule ARGS "@rx (?i)(?<!\w)union(?!\w)" "id:31001,phase:2,deny,status:403,t:none,t:urlDecodeUni,capture,log,msg:'SQLi',logdata:'%{TX.0}'"
SecRule ARGS:ssn "@verifySSN \d{3}-?\d{2}-?\d{4}" "id:31002,phase:2,deny"
SecAction "id:31003,phase:1,pass,nolog,initcol:ip=%{REMOTE_ADDR},setvar:ip.hits=+1,expirevar:ip.hits=60"

# expect: -
# Оператор, которого нет во второй версии, здесь на месте.
SecRule ARGS:svnr "@verifySVNR \d{10}" "id:31004,phase:2,deny"

# expect: notInEngine
# Перенаправление на другой сервер умеет только вторая версия.
SecRule REQUEST_URI "@beginsWith /legacy/" "id:31010,phase:1,proxy:http://backend.internal/"

# expect: notInEngine
SecRule ARGS:password "@rx ." "id:31011,phase:2,pass,nolog,sanitiseMatched"

# expect: notInEngine notInEngine
# Вставка в тело ответа: ни директивы, ни действия.
SecContentInjection On
SecRule RESPONSE_CONTENT_TYPE "@beginsWith text/html" "id:31012,phase:3,pass,nolog,append:'<!-- checked -->'"

# expect: notInEngine
SecRule ARGS "@rsub s/foo/bar/" "id:31013,phase:2,pass,nolog"

# expect: notInEngine
# Переменная потокового разбора тела.
SecRule STREAM_OUTPUT_BODY "@rx (?i)passw(?:or)?d" "id:31014,phase:4,deny"

# expect: notInEngine
SecGuardianLog |/usr/local/bin/httpd-guardian

# expect: notInEngine notInEngine
# Имена, придуманные Coraza: ModSecurity их не знает.
SecRule URI_PARSE_ERROR "@eq 1" "id:31015,phase:1,deny"
SecRule REQUEST_URI "@restpath /api/{id}" "id:31016,phase:1,pass,nolog"

# expect: -
# Макрос с двоеточием третья версия читает; вторая и Coraza — нет.
SecRule ARGS "@rx ^m3" "id:31020,phase:2,pass,log,msg:'Host is %{REQUEST_HEADERS:Host}'"

# expect: defaultActionRepeated
# Вторая версия позволяет менять умолчания по ходу файла, третья — нет.
# Стоит последним: действует на всё, что ниже.
SecDefaultAction "phase:2,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"
