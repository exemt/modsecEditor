# Исключения: ссылки на правила по номеру, тегу и сообщению.
#
# Формат тот же, что в `findings.conf`. Исключение — указатель, и почти
# каждая ошибка в нём не в записи, а в том, что указатель ни во что не
# упирается: номера нет, запись стоит не с той стороны от правила, правило
# уже снято.

# expect: -
# Правила, на которые ссылаются примеры ниже.
SecRule ARGS "@rx ^a1" "id:41001,phase:2,pass,tag:'app/one',msg:'First rule'"
SecRule ARGS|REQUEST_COOKIES "@rx ^a2" "id:41002,phase:2,pass,tag:'app/two',msg:'Second rule'"
SecRule ARGS "@rx ^a3" "id:41003,phase:2,pass,tag:'app/three'"

# expect: -
# Как надо: директива стоит ниже правила, а ctl отрабатывает раньше него.
SecRuleUpdateTargetById 41001 "!ARGS:password"
SecRuleUpdateTargetByTag "app/two" "!ARGS:csrf"
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:41010,phase:1,pass,nolog,t:none,t:lowercase,ctl:ruleRemoveById=41002,ctl:ruleRemoveTargetById=41003;ARGS:html"

# ---------------------------------------------------------------------
# Запись
# ---------------------------------------------------------------------

# expect: exclusionNoTarget
SecRuleRemoveById

# expect: exclusionBadId
SecRuleRemoveById abc

# expect: exclusionEmptyRange exclusionNoMatch
# Диапазон задом наперёд не покрывает ничего.
SecRuleRemoveById 41009-41001

# expect: exclusionCtlNoTarget
# После «;» должна идти область, которую снять.
SecRule REQUEST_URI "@rx ^/b4" "id:41011,phase:1,pass,nolog,ctl:ruleRemoveTargetById=41003"

# expect: exclusionCtlBadId suspiciousActionValue
# У ctl выборка одна: список он прочитает как один номер и не найдёт его.
# А кавычки вокруг самой опции третья версия не разбирает вовсе.
SecRule REQUEST_URI "@rx ^/b5" "id:41012,phase:1,pass,nolog,ctl:'ruleRemoveById=41001 41002'"

# expect: exclusionCtlTargetList
SecRule REQUEST_URI "@rx ^/b6" "id:41013,phase:1,pass,nolog,ctl:ruleRemoveTargetById=41002;ARGS:a|ARGS:b"

# expect: exclusionCtlDeadTarget
# Область сравнивается по имени и параметру; «!» в сравнении не участвует.
SecRule REQUEST_URI "@rx ^/b7" "id:41014,phase:1,pass,nolog,ctl:ruleRemoveTargetById=41002;!ARGS:a"

# expect: exclusionUpdateTargetNotExclusion
# Без «!» область не вычитается, а добавляется.
SecRuleUpdateTargetById 41003 "ARGS:extra"

# expect: exclusionUpdateActionMetadata
# Номер правила этой директивой не сменить.
SecRuleUpdateActionById 41003 "id:5,pass"

# ---------------------------------------------------------------------
# Указатель ни во что не упирается
# ---------------------------------------------------------------------

# expect: exclusionNoMatch
# Соседи по тысяче загружены, а такого правила среди них нет.
SecRuleRemoveById 41999

# expect: exclusionBeforeRule
# Директива применяется, пока конфигурация читается: правила ещё нет.
SecRuleRemoveById 41020
SecRule ARGS "@rx ^c2" "id:41020,phase:2,pass"

# expect: exclusionCtlAfterRule
# ctl применяется при срабатывании носителя, а цель к тому времени проверена.
SecRule REQUEST_URI "@rx ^/c3" "id:41021,phase:1,pass"
SecRule REQUEST_FILENAME "@rx ^/c3" "id:41022,phase:2,pass,nolog,ctl:ruleRemoveById=41021"

# expect: exclusionCtlCarrierStops
# Носитель сам обрывает запрос: до снятого правила дело не дойдёт.
SecRule REQUEST_URI "@rx ^/c4" "id:41023,phase:1,deny,msg:'Blocked',ctl:ruleRemoveById=41003"

# expect: exclusionRemovedThenUpdated
SecRule ARGS "@rx ^c5" "id:41030,phase:2,pass"
SecRuleRemoveById 41030
SecRuleUpdateTargetById 41030 "!ARGS:x"

# expect: exclusionCtlAlreadyRemoved
SecRule ARGS "@rx ^c6" "id:41031,phase:2,pass"
SecRuleRemoveById 41031
SecRule REQUEST_URI "@rx ^/c6" "id:41032,phase:1,pass,nolog,ctl:ruleRemoveById=41031"

# ---------------------------------------------------------------------
# Работает, но так лучше не писать
# ---------------------------------------------------------------------

# expect: exclusionDuplicate
SecRuleUpdateTargetById 41002 "!ARGS:token"
SecRuleUpdateTargetById 41002 "!ARGS:token"

# expect: exclusionByMsgFragile
# Текст сообщения меняется от версии к версии набора.
SecRule ARGS "@rx ^d2" "id:41033,phase:2,pass,msg:'Fragile one'"
SecRuleRemoveByMsg "Fragile one"

# expect: exclusionTooBroad
# Одиннадцать правил одним махом — это уже не исключение, а отказ от категории.
SecAction "id:41040,phase:1,pass,nolog,tag:'bulk'"
SecAction "id:41041,phase:1,pass,nolog,tag:'bulk'"
SecAction "id:41042,phase:1,pass,nolog,tag:'bulk'"
SecAction "id:41043,phase:1,pass,nolog,tag:'bulk'"
SecAction "id:41044,phase:1,pass,nolog,tag:'bulk'"
SecAction "id:41045,phase:1,pass,nolog,tag:'bulk'"
SecAction "id:41046,phase:1,pass,nolog,tag:'bulk'"
SecAction "id:41047,phase:1,pass,nolog,tag:'bulk'"
SecAction "id:41048,phase:1,pass,nolog,tag:'bulk'"
SecAction "id:41049,phase:1,pass,nolog,tag:'bulk'"
SecAction "id:41050,phase:1,pass,nolog,tag:'bulk'"
SecRuleRemoveByTag "bulk"

# ---------------------------------------------------------------------
# Выборка по тегу: шаблон или строка
# ---------------------------------------------------------------------

# expect: exclusionBadPattern
# Вторая версия собирает из выборки регулярное выражение — и это не оно.
SecRuleRemoveByTag "app/(one"

# expect: exclusionPatternNotPortable
# Шаблон понимает только вторая версия: третья и Coraza ищут тег с таким
# именем целиком и не находят.
SecRuleUpdateTargetByTag "^app/" "!ARGS:lang"

# expect: exclusionPatternNotPortable
# И без спецсимволов выборка читается по-разному: вторая версия найдёт
# `app` внутри `app/three`, остальные — нет.
SecRuleUpdateTargetByTag "app" "!ARGS:theme"

# expect: exclusionTargetNotInRule
# Правило проверяет куки, а исключение снимает параметр — снимать нечего.
SecRule REQUEST_COOKIES "@rx <script\b" "id:41051,phase:2,deny,msg:'XSS in cookies'"
SecRuleUpdateTargetById 41051 "!ARGS:comment"

# expect: exclusionTargetInLink
# Параметр проверяет звено цепочки: третья версия и Coraza правят только
# первое условие, и исключение для них ничего не делает.
SecRule REQUEST_METHOD "@streq POST" "id:41052,phase:2,deny,msg:'XSS in a comment',chain"
    SecRule ARGS:comment "@rx <script\b" "t:none"
SecRuleUpdateTargetById 41052 "!ARGS:comment"

# expect: exclusionCtlTargetInLink
# У `ctl` наоборот: из звена область снимет одна Coraza.
SecRule REQUEST_FILENAME "@endsWith /editor" "id:41053,phase:1,pass,nolog,ctl:ruleRemoveTargetById=41054;ARGS:body"
SecRule REQUEST_METHOD "@streq POST" "id:41054,phase:2,deny,msg:'XSS in the body',chain"
    SecRule ARGS:body "@rx <script\b" "t:none"

# expect: exclusionCtlPattern
# Шаблон в `ctl` понимает одна Coraza: вторая версия его пропускает, третья не грузит.
SecRule REQUEST_FILENAME "@endsWith /search" "id:41055,phase:1,pass,nolog,ctl:ruleRemoveTargetById=41056;ARGS:/^q_/"
SecRule ARGS "@rx <script\b" "id:41056,phase:2,deny,msg:'XSS'"

# expect: exclusionHeaderCase
# Третья версия сравнивает имя заголовка в исключении буква в букву, а
# по HTTP/2 оно приходит строчными.
SecRule REQUEST_HEADERS "@rx <script\b" "id:41057,phase:1,deny,msg:'XSS in headers'"
SecRuleUpdateTargetById 41057 "!REQUEST_HEADERS:User-Agent"

# expect: exclusionCtlHeaderCase
# То же в `ctl`, где шаблона третья версия не принимает.
SecRule REQUEST_FILENAME "@endsWith /upload" "id:41058,phase:1,pass,nolog,ctl:ruleRemoveTargetById=41059;REQUEST_HEADERS:Referer"
SecRule REQUEST_HEADERS "@rx <script\b" "id:41059,phase:2,deny,msg:'XSS in headers'"
