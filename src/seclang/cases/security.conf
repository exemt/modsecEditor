# Правила, которые написаны верно, но защищают не так, как кажется.
#
# Формат тот же, что в остальных файлах: блок начинается строкой `# expect:`
# с кодами, которые линтер обязан выдать. Файл свой, потому что одна из
# проверок — о наборе целиком: тело разбирается (`SecRequestBodyAccess On`),
# а ошибку разбора не читает ни одно правило в файле.

# expect: bodyErrorUnchecked
# Тело разбирается, а ошибку разбора не читает никто: чего разборщик не
# разобрал, того правила не увидят.
SecRequestBodyAccess On

# expect: relaxedByClientInput
# Защиту снимает заголовок, который клиент пишет сам.
SecRule REQUEST_HEADERS:User-Agent "@streq internal-monitor" "id:70001,phase:1,allow,nolog"

# expect: relaxedByClientInput
# То же с выключением движка по куки.
SecRule REQUEST_COOKIES:debug "@streq 1" "id:70002,phase:1,pass,nolog,ctl:ruleEngine=Off"

# expect: -
# Адрес клиента подделать нельзя: снимать защиту по нему — обычное дело.
SecRule REMOTE_ADDR "@ipMatch 10.0.0.0/8" "id:70003,phase:1,pass,nolog,ctl:ruleEngine=Off"

# expect: secretInLog
# Пароль уходит в журнал открытым текстом.
SecRule ARGS:password "@rx ^.{0,7}$" "id:70004,phase:2,deny,msg:'Password too short',logdata:'%{MATCHED_VAR}'"

# expect: -
# Имя параметра вместо значения — так можно.
SecRule ARGS:password "@rx ^.{0,5}$" "id:70005,phase:2,deny,msg:'Password too short',logdata:'%{MATCHED_VAR_NAME}'"
