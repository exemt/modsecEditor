# Правила без единого замечания — в разных манерах записи.
#
# Каждый блок начинается строкой `# expect:` и тянется до следующей такой
# строки. После двоеточия — коды замечаний, которые линтер обязан выдать на
# блок, через пробел; прочерк значит «ни одного». Проверяет `cases.test.ts`.

# expect: -
# Настройка набора: значения, на которые опираются правила ниже, и сессия.
SecAction "id:10000,phase:1,pass,nolog,t:none,setvar:tx.paranoia_level=1,setvar:tx.critical_anomaly_score=5,setvar:tx.inbound_anomaly_score_threshold=5"
SecRule REQUEST_COOKIES:sessionid "@rx ^[a-f0-9]{32}$" \
    "id:10050,phase:1,pass,nolog,t:none,setsid:%{REQUEST_COOKIES.sessionid},setvar:session.csrf_token=%{UNIQUE_ID}"

# expect: -
# Настройка движка: директивы с одним, несколькими и закавыченными аргументами.
SecRuleEngine On
SecRequestBodyAccess On
SecRule REQBODY_ERROR "!@eq 0" "id:10072,phase:2,deny,status:400,msg:'Failed to parse request body',logdata:'%{REQBODY_ERROR_MSG}'"
SecRequestBodyLimit 13107200
SecResponseBodyMimeType text/plain text/html text/xml
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecComponentSignature "OWASP_CRS/4.0.0"
SecRuleRemoveById 941100 942100-942199
SecRuleUpdateTargetById 942100 "!ARGS:password"
SecArgumentSeparator &
SecDataDir /var/cache/modsecurity
SecGeoLookupDb /usr/share/GeoIP/GeoLite2-Country.mmdb

# expect: -
# Чужие директивы: о них линтер ничего не знает и знать не должен.
<IfModule security2_module>
    Include /etc/modsecurity/rules/*.conf
    IncludeOptional /etc/modsecurity/local/*.conf
</IfModule>

# expect: -
# В одну строку, как писали во времена второй версии: номер и критичность в кавычках.
SecRule REQUEST_HEADERS:User-Agent "@pm nikto sqlmap nessus" "phase:1,id:'10001',t:none,t:lowercase,deny,status:403,msg:'Scanner detected',severity:'2',tag:'automation/scanner'"

# expect: -
# По строке на действие, как в CRS: переносы стоят внутри кавычек.
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|XML:/* "@rx (?i)\bunion\b.{1,100}?\bselect\b" \
    "id:10002,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:replaceComments,\
    msg:'SQL Injection Attack',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# expect: -
# Оператор не назван: подразумевается @rx.
SecRule REQUEST_URI "^/(?:admin|manager)/" "id:10003,phase:1,deny,status:403,log,msg:'Restricted area'"

# expect: -
# Отрицание оператора.
SecRule REQUEST_METHOD "!@rx ^(?:GET|HEAD|POST|OPTIONS)$" "id:10004,phase:1,deny,status:405,log,msg:'Method is not allowed'"

# expect: -
# Подсчёт: заголовка нет вовсе. `t:none` при подсчёте — норма, он снимает умолчания.
SecRule &REQUEST_HEADERS:Host "@eq 0" "id:10005,phase:1,deny,status:400,t:none,log,msg:'Request is missing a Host header'"

# expect: -
# Цепочка: действия в голове, звенья с отступом, между ними комментарий.
SecRule REQUEST_METHOD "@streq POST" \
    "id:10006,phase:2,deny,status:403,log,msg:'Oversized login form',chain"
    # Только форма входа
    SecRule REQUEST_FILENAME "@endsWith /login" "chain,t:none,t:urlDecodeUni,t:lowercase"
    SecRule &ARGS "@gt 20" "t:none"

# expect: -
# Безусловное действие: коллекции, счётчики, срок жизни.
SecAction "id:10007,phase:1,pass,nolog,initcol:ip=%{REMOTE_ADDR},setvar:tx.limit=10,setvar:ip.hits=+1,expirevar:ip.hits=60"

# expect: -
# Параметры: по имени, шаблоном, шаблоном в кавычках, с вычитанием.
SecRule ARGS:q|ARGS:/^filter_/|REQUEST_COOKIES:'/^(?:sess|auth)_/'|!ARGS:filter_raw "@detectXSS" \
    "id:10009,phase:2,block,t:none,t:urlDecodeUni,t:htmlEntityDecode,log,msg:'XSS'"

# expect: -
# Разбор XML и загруженные файлы.
SecRule XML:/* "@rx (?i)<!ENTITY" "id:10010,phase:2,deny,status:403,t:none,log,msg:'XML entity'"
SecRule FILES_NAMES|FILES "@rx (?i)\.(?:php\d?|phtml|jsp)$" "id:10011,phase:2,deny,status:403,t:none,log,msg:'Executable upload'"

# expect: -
# Настройка на время запроса.
SecRule REQUEST_URI "@beginsWith /api/upload" \
    "id:10012,phase:1,pass,nolog,t:none,t:urlDecodeUni,ctl:ruleRemoveById=942100,ctl:ruleRemoveTargetById=941100;ARGS:html,ctl:requestBodyAccess=Off"

# expect: -
# Переход через блок: метка стоит ниже.
SecRule TX:paranoia_level "@lt 2" "id:10013,phase:1,pass,nolog,skipAfter:END-STRICT-CHECKS"
SecRule REQUEST_HEADERS:Accept "@rx ^$" "id:10014,phase:1,deny,status:400,log,msg:'Empty Accept'"
SecMarker "END-STRICT-CHECKS"

# expect: -
# Фазы ответа. Код ответа — число, но проверять его шаблоном можно.
SecRule RESPONSE_STATUS "@rx ^5\d\d$" "id:10015,phase:3,pass,log,msg:'Server error'"
SecRule RESPONSE_BODY "@pmFromFile sql-errors.data" "id:10016,phase:4,block,t:none,log,msg:'SQL error leak'"
SecRule RESPONSE_HEADERS:Server "@contains Apache/2.2" "id:10017,phase:3,pass,log,msg:'Old server banner'"

# expect: -
# Числовое сравнение с названным заголовком: что в нём число, знает автор.
SecRule REQUEST_HEADERS:Content-Length "@gt 1048576" "id:10018,phase:1,deny,status:413,log,msg:'Body too large'"
SecRule ARGS:page "!@rx \A\d{1,5}\z" "id:10019,phase:2,deny,status:400,log,msg:'Bad page number'"

# expect: -
# Длина значения: после t:length сравнивается уже число.
SecRule ARGS:comment "@gt 2000" "id:10020,phase:2,deny,status:413,t:none,t:length,log,msg:'Comment too long'"

# expect: -
# Хеш сравнивают с текстом только после hexEncode, и в нижнем регистре.
SecRule &REQUEST_HEADERS:X-Api-Key "@eq 0" "id:10073,phase:1,deny,status:401,log,msg:'No API key'"
SecRule REQUEST_HEADERS:X-Api-Key "!@streq 5baa61e4c9b93f3f0682250b6cf8331b7ee68fd8" \
    "id:10021,phase:1,deny,status:401,t:none,t:sha1,t:hexEncode,log,msg:'Bad API key'"

# expect: -
# Оператор на значение не смотрит, но правило читает его через MATCHED_VAR.
SecRule REQUEST_HEADERS:User-Agent "@unconditionalMatch" \
    "id:10022,phase:1,pass,nolog,t:none,t:sha1,t:hexEncode,setvar:tx.ua_hash=%{MATCHED_VAR}"

# expect: -
# Сравнение с макросом: что в нём окажется, известно только на запросе.
SecRule &ARGS:csrf_token "@eq 0" "id:10074,phase:2,deny,status:403,log,msg:'No CSRF token'"
SecRule ARGS:csrf_token "!@streq %{SESSION.csrf_token}" "id:10023,phase:2,deny,status:403,t:lowercase,log,msg:'CSRF token mismatch'"
SecRule TX:inbound_anomaly_score_pl1 "@ge %{tx.inbound_anomaly_score_threshold}" "id:10024,phase:2,deny,status:403,log,msg:'Anomaly score exceeded'"

# expect: -
# География: оператор заполняет GEO, следующее звено его читает.
SecRule REMOTE_ADDR "@geoLookup" "id:10025,phase:1,deny,status:403,log,msg:'Country is not allowed',chain"
    SecRule GEO:COUNTRY_CODE "!@pm US CA GB"

# expect: -
# Адреса и байты.
SecRule REMOTE_ADDR "@ipMatch 10.0.0.0/8,192.168.0.0/16,::1" "id:10026,phase:1,pass,nolog,ctl:ruleEngine=Off"
SecRule REMOTE_ADDR "@ipMatchFromFile blocklist.txt" "id:10027,phase:1,drop,log,msg:'Blocklisted address'"
SecRule ARGS "@validateByteRange 9,10,13,32-126" "id:10028,phase:2,deny,status:400,t:none,log,msg:'Invalid byte'"
SecRule ARGS "@validateUtf8Encoding" "id:10029,phase:2,deny,status:400,t:none,log,msg:'Invalid UTF-8'"

# expect: -
# Имена без учёта регистра: движок их так и сравнивает.
secrule args "@RX ^attack" "ID:10030,PHASE:2,DENY,STATUS:403,T:lowercase,LOG,MSG:'Lowercase directive'"

# expect: -
# Фаза словом.
SecRule REQUEST_HEADERS:Content-Type "@beginsWith text/xml" "id:10031,phase:request,pass,nolog,t:none,t:lowercase,ctl:requestBodyProcessor=XML"
SecAction "id:10032,phase:logging,pass,nolog,setvar:!ip.hits"

# expect: -
# Кавычки и слэши внутри шаблона; значение с запятой и двоеточием — в кавычках.
SecRule ARGS "@rx (?i)<a[^>]+href\s*=\s*[\"']?javascript:" \
    "id:10033,phase:2,redirect:'https://example.com/blocked?reason=xss,injection',log,msg:'It\'s a \"javascript:\" link'"

# expect: -
# Все формы setvar.
SecAction "id:10034,phase:1,pass,nolog,setvar:tx.a=1,setvar:tx.b=+%{tx.a},setvar:tx.c=-1,setvar:!tx.d,setvar:'tx.e=text with spaces',setvar:tx.%{rule.id}_seen=1"

# expect: -
# Редкие действия.
SecRule ARGS:password "@rx ." "id:10035,phase:2,pass,nolog,sanitiseMatched,multiMatch,t:none,t:urlDecodeUni"
SecRule REQUEST_HEADERS:SOAPAction "@rx ." "id:10036,phase:1,pass,nolog,xmlns:soap=http://schemas.xmlsoap.org/soap/envelope/,exec:/usr/local/bin/notify.sh"

# expect: -
# Значение по умолчанию: проверка «переменной ещё нет» — не чтение пустого.
SecRule &TX:arg_length "@eq 0" "id:10051,phase:1,pass,nolog,setvar:tx.arg_length=400"
SecRule ARGS "@gt %{tx.arg_length}" "id:10052,phase:2,deny,status:400,t:none,t:length,log,msg:'Argument too long'"

# expect: -
# Необязательная настройка: правило само убеждается, что переменная есть,
# и только потом её читает. Выставляют её в файле, которого здесь нет.
SecRule &TX:max_num_args "@eq 1" "id:10053,phase:2,deny,status:400,log,msg:'Too many arguments',chain"
    SecRule &ARGS "@gt %{tx.max_num_args}" "t:none"

# expect: -
# Порядок исполнения — фаза, а не строка: запись стоит ниже чтения, но
# выполняется раньше.
SecRule TX:early_flag "@eq 1" "id:10054,phase:2,deny,status:403,log,msg:'Flagged in phase 1'"
SecRule REQUEST_HEADERS:X-Debug "@rx ." "id:10055,phase:1,pass,nolog,setvar:tx.early_flag=1"

# expect: -
# Пропуск следующего правила: считается в пределах своей фазы.
SecRule REQUEST_METHOD "@streq OPTIONS" "id:10056,phase:1,pass,nolog,skip:1"
SecRule REQUEST_HEADERS:Origin "@rx ^$" "id:10057,phase:1,deny,status:400,log,msg:'Empty Origin'"

# expect: -
# Захваченная группа читается в том же правиле, где стоит capture, — в том
# числе в другом звене цепочки.
SecRule REQUEST_BASENAME "@rx \.([a-z0-9]{1,6})$" "id:10058,phase:1,deny,status:403,capture,t:none,t:lowercase,log,msg:'Executable extension',logdata:'%{TX.0}',chain"
    SecRule TX:1 "@rx ^(?:php|phtml|jsp)$"

# expect: -
# Записи PCRE, которых нет в JavaScript: всё это рабочие шаблоны.
SecRule ARGS "@rx (?i)\bunion\b" "id:10060,phase:2,pass,t:none"
SecRule ARGS "@rx (?i:select)[[:space:]]++from" "id:10061,phase:2,pass,t:none"
SecRule ARGS "@rx (?>a|ab)c[\x7f-\x{ff}]" "id:10062,phase:2,pass,t:none"
SecRule ARGS "@rx (?P<key>\w+)=(?P=key)" "id:10063,phase:2,pass,t:none"
SecRule ARGS "@rx \A\h*\Qa.b*c\E\R\z" "id:10064,phase:2,pass,t:none"
SecRule ARGS "@rx (?x) select \s+ from  # комментарий внутри шаблона" "id:10065,phase:2,pass,t:none"

# expect: -
# Запись, перевести которую нечем (рекурсия, \K): о шаблоне — молчание.
SecRule ARGS "@rx \((?:[^()]++|(?R))*\)" "id:10066,phase:2,pass,t:none"
SecRule ARGS "@rx foo\Kbar" "id:10067,phase:2,pass,t:none"

# expect: -
# Необязательная часть в середине шаблона — не «подходит ко всему».
SecRule ARGS "@rx colou(?:r|)s?\b" "id:10068,phase:2,pass,t:none"

# expect: -
# Шаблон «что угодно» ради значения: захватить целиком или взять после
# преобразований.
SecRule UNIQUE_ID "@rx (.*)" "id:10069,phase:1,pass,nolog,t:sha1,t:hexEncode,capture,setvar:tx.request_hash=%{TX.1}"

# expect: -
# Шаблон из макроса: что в нём окажется, известно только на запросе.
SecAction "id:10071,phase:1,pass,nolog,setvar:tx.allowed_prefix=/app"
SecRule REQUEST_URI "@rx ^%{tx.allowed_prefix}" "id:10070,phase:1,pass,nolog"

# expect: -
# Правило на Lua: областей и оператора нет, действия — как у обычного.
SecRuleScript lua/bayes_check.lua "id:10038,phase:2,block,t:none,msg:'Bayesian analysis',setvar:tx.anomaly_score=+%{tx.critical_anomaly_score}"

# expect: -
# Умолчания: после них фазу в правиле можно не писать. Стоит последним,
# потому что действует на всё, что ниже.
SecDefaultAction "phase:2,log,auditlog,pass"
SecRule ARGS "@detectSQLi" "id:10037,block,t:none,t:urlDecodeUni,msg:'SQLi'"
