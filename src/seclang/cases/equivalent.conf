# Одно и то же, записанное по-разному.
#
# Блок начинается строкой `# group:`; все утверждения блока обязаны
# разобраться в одно и то же — те же области проверки, оператор и действия
# с теми же значениями. Различаться могут только границы узлов и то, как
# значение было записано. Проверяет `cases.test.ts`.

# group: расположение по строкам и пробелы
SecRule ARGS|!ARGS:token "@rx (?i)union\s+select" "id:1,phase:2,deny,t:none,t:urlDecodeUni,msg:'SQL injection'"
SecRule ARGS|!ARGS:token "@rx (?i)union\s+select" \
    "id:1,\
    phase:2,\
    deny,\
    t:none,t:urlDecodeUni,\
    msg:'SQL injection'"
SecRule ARGS|!ARGS:token \
"@rx (?i)union\s+select" \
"id:1,phase:2,deny,t:none,t:urlDecodeUni,msg:'SQL injection'"
SecRule	ARGS|!ARGS:token	  "@rx (?i)union\s+select"     "id:1 , phase:2 ,deny,  t:none ,t:urlDecodeUni, msg:'SQL injection'"
        SecRule ARGS|!ARGS:token "@rx (?i)union\s+select" "id:1,phase:2,deny,t:none,t:urlDecodeUni,msg:'SQL injection',"

# group: кавычки вокруг аргументов и значений
SecRule ARGS|!ARGS:token "@contains /etc/passwd" "id:2,phase:2,deny,status:403"
SecRule "ARGS|!ARGS:token" "@contains /etc/passwd" id:2,phase:2,deny,status:403
SecRule ARGS|!ARGS:'token' "@contains /etc/passwd" "id:'2',phase:'2',deny,status:'403'"
SecRule ARGS|"!ARGS:token" "@contains /etc/passwd" "id:2,phase:2,"deny,status:403

# group: разделители списка областей
SecRule ARGS_GET|ARGS_POST|REQUEST_COOKIES "@detectXSS" "id:3,phase:2,block"
SecRule ARGS_GET,ARGS_POST,REQUEST_COOKIES "@detectXSS" "id:3,phase:2,block"
SecRule "ARGS_GET | ARGS_POST | REQUEST_COOKIES" "@detectXSS" "id:3,phase:2,block"

# group: явный и подразумеваемый оператор
SecRule REQUEST_URI "@rx ^/admin" "id:4,phase:1,deny"
SecRule REQUEST_URI "^/admin" "id:4,phase:1,deny"

# group: отрицание
SecRule REQUEST_METHOD "!@streq GET" "id:5,phase:1,deny"
SecRule REQUEST_METHOD "! @streq GET" "id:5,phase:1,deny"
SecRule REQUEST_METHOD "!@streq    GET" "id:5,phase:1,deny"

# group: экранирование кавычек на двух уровнях
SecRule ARGS "@rx <a href=\"javascript:" "id:6,phase:2,deny,msg:'It\'s a \"link\"'"
SecRule ARGS "@rx <a href=\"javascript:" \
    "id:6,phase:2,deny,\
    msg:'It\'s a \"link\"'"

# group: значение с запятой и присваивания
SecAction "id:7,phase:1,pass,setvar:tx.score=+5,setvar:'tx.note=a, b',setvar:!tx.old"
SecAction "id:7,phase:1,pass,setvar:'tx.score=+5',setvar:'tx.note=a, b',setvar:'!tx.old'"
SecAction "id:7, phase:1, pass, setvar:tx.score=+5, setvar:'tx.note=a, b', setvar:!tx.old"

# group: перенос посреди значения исчезает бесследно
SecRule ARGS "@pm alpha beta gamma" "id:8,phase:2,deny,msg:'three words here'"
SecRule ARGS "@pm alpha be\
ta gamma" "id:8,phase:2,deny,msg:'three wo\
rds here'"

# group: метка в кавычках и без
SecMarker END-OF-CHECKS
SecMarker "END-OF-CHECKS"
SecMarker    END-OF-CHECKS
