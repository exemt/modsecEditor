# Правила с изъяном: в каждом блоке — ровно то, что названо в `# expect:`.
#
# options: {"codes":{"blockWithoutMsg":"off","noNormalisation":"off"}}
#
# Строка выше выключает два совета, которые легли бы почти на каждый пример:
# «у блокирующего правила нет msg» и «значение сравнивается без
# преобразований». Примеры здесь нарочно короткие; сами эти советы показаны
# в `reactions.conf`.
#
# Формат тот же, что в `clean.conf`. Каждый код замечания встречается здесь
# хотя бы раз; за этим следит `cases.test.ts`, так что новая проверка без
# примера сюда не пройдёт.

# expect: -
# Настройка: без неё замечания о переменных и коллекциях легли бы на все
# блоки ниже и заслонили то, что в них показано.
SecDataDir /var/cache/modsecurity
SecAction "id:20000,phase:1,pass,nolog,t:none,initcol:ip=%{REMOTE_ADDR},setsid:%{REQUEST_COOKIES.sid},setvar:tx.paranoia_level=1,setvar:tx.dos_counter_threshold=100,setvar:ip.dos_counter=+1"

# ---------------------------------------------------------------------
# Форма записи
# ---------------------------------------------------------------------

# expect: unbalancedQuotes
# Кавычка оператора закрыта не там: список действий остался без пары.
SecRule ARGS "@rx attack "id:20001,phase:2,deny"

# expect: unknownDirective
SecRuleEngin On

# expect: directiveArgCount missingId missingPhase
# Одного аргумента мало: нет ни оператора, ни действий.
SecRule ARGS

# expect: directiveArgCount
SecMarker

# expect: missingId missingPhase regexIsPlainText
# Оператор забыт, и на его место встал список действий — как шаблон,
# причём без единого спецсимвола.
SecRule ARGS "id:20002,phase:2,deny"

# expect: emptyTargets
SecRule "" "@rx ^attack" "id:20003,phase:2,deny"

# expect: unknownOperator
SecRule ARGS "@regex attack" "id:20004,phase:2,deny"

# expect: unknownVariable
SecRule REQUEST_HEADER:Host "@rx ^evil" "id:20005,phase:1,deny"

# expect: unknownTransform
SecRule ARGS "@rx ^attack" "id:20006,phase:2,deny,t:lowercas"

# expect: unknownAction
SecRule ARGS "@rx ^attack" "id:20007,phase:2,deny,loggg"

# expect: actionValueRequired
SecRule ARGS "@rx ^attack" "id:20008,phase:2,deny,msg"

# expect: actionValueUnexpected
SecRule ARGS "@rx ^attack" "id:20009,phase:2,deny:403"

# expect: unterminatedMacro
SecRule ARGS_GET "@rx ^attack" "id:20010,phase:2,deny,logdata:'Matched %{MATCHED_VAR'"

# expect: operatorArgumentRequired
SecRule REQUEST_METHOD "@streq" "id:20011,phase:1,deny"

# expect: operatorArgumentUnexpected
SecRule ARGS "@detectSQLi union select" "id:20012,phase:2,deny"

# expect: missingId
SecRule ARGS "@rx ^attack" "phase:2,deny"

# expect: missingPhase
SecRule REQUEST_URI "@rx ^attack" "id:20013,deny"

# expect: duplicateId
SecRule ARGS "@rx ^one" "id:20014,phase:2,deny"
SecRule ARGS "@rx ^two" "id:20014,phase:2,deny"

# expect: danglingChain
SecRule ARGS "@rx ^attack" "id:20015,phase:2,deny,chain"
SecRuleEngine On

# expect: chainLinkHeadAction chainLinkHeadAction
# Номер и реакция принадлежат голове цепочки.
SecRule REQUEST_METHOD "@streq POST" "id:20016,phase:2,chain"
    SecRule ARGS "@rx ^attack" "id:20017,deny"

# expect: chainLinkHeadAction chainLinkHeadAction chainLinkHeadAction duplicateCondition
# Из CRS 2.2.9 (modsecurity_crs_16_session_hijacking.conf): лишний `chain`
# в конце первого правила пристёгивает к нему следующее целиком.
SecRule &SESSION:SESSIONID "@eq 1" "chain,phase:5,id:'20018',nolog,pass,t:none"
    SecRule REMOTE_ADDR "^(\d{1,3}\.\d{1,3}\.\d{1,3}\.)" "chain,nolog,capture,t:none"
    SecRule TX:1 ".*" "chain,t:sha1,t:hexEncode,setvar:session.ip_hash=%{matched_var}"
SecRule &SESSION:SESSIONID "@eq 1" "chain,phase:5,id:'20019',nolog,pass,t:none"
    SecRule REQUEST_HEADERS:User-Agent ".*" "t:none,t:sha1,t:hexEncode,nolog,setvar:session.ua_hash=%{matched_var}"

# ---------------------------------------------------------------------
# Области проверки
# ---------------------------------------------------------------------

# expect: countOnScalar
SecRule &REQUEST_URI "@eq 0" "id:20020,phase:1,deny"

# expect: selectorNotSupported
SecRule REQUEST_METHOD:GET "@rx ." "id:20021,phase:1,deny"

# expect: selectorRequired
SecRule TX "@rx ^attack" "id:20022,phase:2,deny"

# expect: excludeWithoutSelector
SecRule ARGS|!ARGS "@rx ^attack" "id:20023,phase:2,deny"

# expect: duplicateTarget
SecRule ARGS:a|ARGS:b|ARGS:a "@rx ^attack" "id:20024,phase:2,deny"

# ---------------------------------------------------------------------
# Конвейер: тип значения от шага к шагу
# ---------------------------------------------------------------------

# expect: transformInputMismatch
# После t:length в руках число: приводить к нижнему регистру нечего.
SecRule ARGS "@gt 100" "id:20030,phase:2,deny,t:length,t:lowercase"

# expect: transformInputMismatch
# После t:md5 — сырые байты: обрезать у них пробелы незачем.
SecRule ARGS:password "@rx ^[0-9a-f]{32}$" "id:20031,phase:2,deny,t:md5,t:trim,t:hexEncode"

# expect: countWithTransforms
SecRule &ARGS "@gt 50" "id:20032,phase:2,deny,t:lowercase"

# expect: transformNoneNotFirst
# Сброс отменяет раскрытие кодирования, стоящее перед ним.
SecRule ARGS "@rx ^attack" "id:20033,phase:2,deny,t:urlDecodeUni,t:none,t:lowercase"

# expect: duplicateTransform
SecRule ARGS "@rx ^attack" "id:20034,phase:2,deny,t:lowercase,t:trim,t:lowercase"

# expect: duplicateTransform
# Из CRS 2.2.9: два сброса подряд.
SecRule IP:DOS_COUNTER "@gt %{tx.dos_counter_threshold}" "phase:5,id:'20035',t:none,nolog,pass,t:none,setvar:ip.dos_burst_counter=+1"

# expect: redundantTransform
# После удаления пробелов обрезать нечего.
SecRule ARGS "@rx ^attack" "id:20036,phase:2,deny,t:removeWhitespace,t:trim"

# expect: redundantTransform
# Из CRS 3.3.10 (правило 932105): cmdLine сам приводит к нижнему регистру.
SecRule ARGS "@rx (?:^|=)\s*(?:{|\s*\(\s*|\w+=(?:[^\s]*|\$.*|\$.*|<.*|>.*|\'.*\'|\".*\")\s+|!\s*|\$)*\s*(?:'|\")*(?:[\?\*\[\]\(\)\-\|+\w'\"\./\\\\]+/)?[\\\\'\"]*(?:l[\\\\'\"]*(?:s(?:[\\\\'\"]*(?:b[\\\\'\"]*_[\\\\'\"]*r[\\\\'\"]*e[\\\\'\"]*l[\\\\'\"]*e[\\\\'\"]*a[\\\\'\"]*s[\\\\'\"]*e)?)|w[\\\\'\"]*p[\\\\'\"]*-[\\\\'\"]*d[\\\\'\"]*o[\\\\'\"]*w[\\\\'\"]*n[\\\\'\"]*l[\\\\'\"]*o[\\\\'\"]*a[\\\\'\"]*d))\b" \
    "id:20037,phase:2,block,t:none,t:cmdLine,t:lowercase,msg:'Remote Command Execution'"

# expect: redundantTransform
# Шестнадцатеричная запись и так в нижнем регистре.
SecRule ARGS:token "@rx ^[0-9a-f]{40}$" "id:20038,phase:2,deny,t:sha1,t:hexEncode,t:lowercase"

# expect: conflictingCaseTransforms
SecRule ARGS "@rx ^\d+$" "id:20039,phase:2,deny,t:lowercase,t:uppercase"

# expect: decodeAfterNormalise
# Из CRS 4.30.0 (правило 933130): путь сворачивается раньше, чем раскрыт %2f.
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS "@pmFromFile php-variables.data" \
    "id:20040,phase:2,block,t:none,t:normalizePath,t:urlDecodeUni,msg:'PHP Injection Attack: Variables Found'"

# expect: transformsWithoutCheck
SecRule ARGS "@unconditionalMatch" "id:20041,phase:2,pass,nolog,t:lowercase,setvar:tx.seen=1"

# ---------------------------------------------------------------------
# Оператор: совпадёт ли сравнение
# ---------------------------------------------------------------------

# expect: operatorInputMismatch
# Числовое сравнение над произвольным текстом: из него получится ноль.
SecRule ARGS "@gt 5" "id:20050,phase:2,deny"

# expect: operatorInputMismatch
# Подсчёт даёт число, а в числе букв не бывает.
SecRule &ARGS "@contains admin" "id:20051,phase:2,deny"

# expect: nonNumericArgument
SecRule &ARGS "@gt many" "id:20052,phase:2,deny"

# expect: hashWithoutHexEncode
SecRule ARGS:password "@streq 5f4dcc3b5aa765d61d8327deb882cf99" "id:20053,phase:2,deny,t:md5"

# expect: caseNeverMatches
SecRule REQUEST_METHOD "@streq POST" "id:20054,phase:1,deny,t:lowercase"

# expect: caseNeverMatches
SecRule ARGS "@contains select" "id:20055,phase:2,deny,t:uppercase"

# expect: caseNeverMatches
# Хеш в шестнадцатеричной записи — в нижнем регистре, а образец — в верхнем.
SecRule ARGS:password "@streq 5F4DCC3B5AA765D61D8327DEB882CF99" "id:20056,phase:2,deny,t:md5,t:hexEncode"

# expect: caseNeverMatches
# Из CRS 4.30.0 (правило 921160, сокращено): после t:lowercase ветка
# `originating-IP` не совпадёт ни с чем.
SecRule ARGS_GET_NAMES|ARGS_GET "@rx [\n\r]+(?:[\s\x0b]|location|re(?:fresh|mote-(?:ip|addr))|(?:set-)?cookie|host|via|originating-IP|x-(?:forwarded-(?:(?:fo|serve)r|host)|(?:remote|originating)-ip))[\s\x0b]*:" \
    "id:20057,phase:1,block,t:none,t:lowercase,msg:'HTTP Header Injection Attack via payload'"

# expect: whitespaceNeverMatches
SecRule ARGS "@contains union select" "id:20058,phase:2,deny,t:removeWhitespace"

# expect: whitespaceNeverMatches
SecRule ARGS "@contains union  select" "id:20059,phase:2,deny,t:compressWhitespace"

# expect: whitespaceNeverMatches
# Пробел в конце образца, а значение обрезано.
SecRule ARGS:role "@streq admin " "id:20060,phase:2,deny,t:trim"

# ---------------------------------------------------------------------
# Покрытие и окружение
# ---------------------------------------------------------------------

# expect: phaseTooEarly
# Тела запроса в первой фазе ещё нет.
SecRule REQUEST_BODY "@rx ^attack" "id:20070,phase:1,deny"

# expect: phasePartial
# В первой фазе в ARGS есть только параметры строки запроса.
SecRule ARGS "@detectSQLi" "id:20071,phase:1,deny,t:none,t:urlDecodeUni"

# expect: missingMarker
SecRule TX:paranoia_level "@lt 2" "id:20072,phase:1,pass,nolog,skipAfter:NO-SUCH-MARKER"

# ---------------------------------------------------------------------
# Регулярные выражения
# ---------------------------------------------------------------------

# expect: invalidRegex
# Скобка не закрыта: движок такое правило не загрузит.
SecRule ARGS "@rx ^(?:admin|root$" "id:20200,phase:2,deny"

# expect: invalidRegex
# Квантору не к чему относиться.
SecRule ARGS "@rx *attack" "id:20201,phase:2,deny"

# expect: invalidSelectorPattern
# Шаблон стоит и в параметре области проверки — и ломается так же.
SecRule ARGS:/^(id_/ "@rx ^attack" "id:20202,phase:2,deny"

# expect: matchesEverything
SecRule ARGS "@rx .*" "id:20203,phase:2,deny"

# expect: matchesEverything
# Пустая ветка на верхнем уровне совпадает с чем угодно.
SecRule ARGS "@rx select|union|" "id:20204,phase:2,deny"

# expect: negationMatchesNothing
SecRule REQUEST_HEADERS:Host "!@rx ^.*$" "id:20205,phase:1,deny"

# expect: possibleRedos
# Квантор внутри группы и квантор на самой группе.
SecRule ARGS "@rx ^(?:a+)+$" "id:20206,phase:2,deny"

# expect: regexIsPlainText
SecRule REQUEST_URI "@rx /etc/passwd" "id:20207,phase:1,deny"

# expect: anchoredLiteralRegex
SecRule REQUEST_METHOD "@rx ^TRACE$" "id:20208,phase:1,deny"

# expect: anchoredLiteralLines
# В ModSecurity 3 и Coraza `^` и `$` — ещё и границы строк: подойдёт и
# `?user=x%0aadmin`. Во второй версии это было бы `@streq admin`.
SecRule ARGS:user "@rx ^admin$" "id:20212,phase:2,deny"

# expect: unescapedDot
# Точка здесь — любой символ: подойдёт и `adminXphp`.
SecRule REQUEST_BASENAME "@rx admin.php" "id:20209,phase:1,deny"

# expect: redundantLeadingWildcard
SecRule REQUEST_FILENAME "@rx .*\.bak$" "id:20210,phase:1,deny"

# expect: capturingGroupUnused
SecRule REQUEST_FILENAME "@rx \.(bak|old|orig)$" "id:20211,phase:1,deny"

# ---------------------------------------------------------------------
# Метки и переходы
# ---------------------------------------------------------------------

# expect: markerBehind
# Метка стоит выше перехода, а `skipAfter` ищет только вниз: не найдя её,
# движок пропустит всё, что осталось в фазе.
SecMarker BEGIN-STRICT-CHECKS
SecRule TX:paranoia_level "@lt 2" "id:20100,phase:1,pass,nolog,skipAfter:BEGIN-STRICT-CHECKS"

# expect: duplicateMarker
# Переход остановится на первой метке; вторая с тем же именем лишняя.
SecRule TX:paranoia_level "@lt 2" "id:20101,phase:1,pass,nolog,skipAfter:END-TWICE"
SecMarker END-TWICE
SecMarker END-TWICE

# expect: unusedMarker
SecMarker NOBODY-JUMPS-HERE

# expect: skipBeyondEnd
# Столько правил в этой фазе после него уже нет.
SecRule REQUEST_METHOD "@streq OPTIONS" "id:20102,phase:1,pass,nolog,skip:500"

# ---------------------------------------------------------------------
# Переменные и коллекции
# ---------------------------------------------------------------------

# expect: txNeverSet
# В загруженных файлах `tx.blocking_mode` никто не выставляет.
SecRule TX:blocking_mode "@eq 1" "id:20110,phase:2,deny"

# expect: txNeverSet
# То же через макрос — в сравнении и в записи другой переменной.
SecRule ARGS "@streq %{tx.expected_token}" "id:20111,phase:2,deny,setvar:tx.seen_token=%{tx.expected_token}"

# expect: txReadBeforeSet
# Читается во второй фазе, а выставляется в пятой: к чтению её ещё нет.
SecRule TX:late_flag "@eq 1" "id:20112,phase:2,deny"
SecAction "id:20113,phase:5,pass,nolog,setvar:tx.late_flag=1"

# expect: txReadBeforeSet
# Фаза одна, но запись стоит ниже чтения.
SecRule ARGS "@streq %{tx.below_flag}" "id:20114,phase:2,deny"
SecAction "id:20115,phase:2,pass,nolog,setvar:tx.below_flag=1"

# expect: variableNeverSet
# Коллекция открыта, но такой переменной в неё никто не кладёт.
SecRule IP:reputation "@gt 5" "id:20116,phase:1,deny"

# expect: collectionNotInitialised
# Без `setuid` коллекция USER не открыта, и счётчик не переживёт запрос.
SecAction "id:20117,phase:1,pass,nolog,setvar:user.attempts=+1"

# expect: captureMissing
# Группу заполняет только `capture`; без него в TX.1 лежит чужое значение.
SecRule ARGS:login "@rx ^(admin|root)$" "id:20118,phase:2,deny,msg:'Privileged login',logdata:'%{TX.1}'"

# expect: captureMissing
# Из CRS 3.3.10 (правило 920500): `%{TX.0}` в журнале, а `capture` нет.
SecRule REQUEST_FILENAME "@rx \.[^.~]+~(?:/.*|)$" \
    "id:20119,phase:2,block,t:none,t:urlDecodeUni,msg:'Attempt to access a backup or working file',logdata:'%{TX.0}'"

# ---------------------------------------------------------------------
# Пометки: замечание известно и принято
# ---------------------------------------------------------------------

# expect: -
# Пометка с кодом снимает его с правила, стоящего ниже.
# seclang-ignore: caseNeverMatches
SecRule REQUEST_METHOD "@streq PUT" "id:20090,phase:1,deny,t:lowercase"

# expect: redundantTransform
# Названо одно замечание из двух — второе остаётся.
# seclang-ignore: caseNeverMatches
SecRule REQUEST_METHOD "@streq POST" "id:20091,phase:1,deny,t:lowercase,t:removeWhitespace,t:trim"

# expect: -
# Без кодов пометка снимает всё — с правила целиком, включая звенья цепочки.
# seclang-ignore
SecRule REQUEST_METHOD "@streq POST" "id:20092,phase:1,deny,t:lowercase,chain"
    SecRule ARGZ "@rx ^attack"

# expect: caseNeverMatches
# Пометка действует на одно правило: следующее проверяется как обычно.
# seclang-ignore
SecRule REQUEST_METHOD "@streq PATCH" "id:20093,phase:1,deny,t:lowercase"
SecRule REQUEST_METHOD "@streq DELETE" "id:20094,phase:1,deny,t:lowercase"

# ---------------------------------------------------------------------
# Несколько изъянов в одном правиле
# ---------------------------------------------------------------------

# expect: unknownVariable caseNeverMatches redundantTransform phaseTooEarly
SecRule REQUEST_BODY|ARGZ "@streq DROP TABLE" "id:20080,phase:1,deny,t:lowercase,t:removeWhitespace,t:trim"

# ---------------------------------------------------------------------
# Строки, байты и то, что пишет клиент
# ---------------------------------------------------------------------

# expect: anchorsMatchLines
# Проверка формата «только цифры». В третьей версии и Coraza `^` и `$` —
# ещё и границы строк, и `1%0a<script>` её проходит.
SecRule ARGS:page "!@rx ^\d+$" "id:20213,phase:2,deny,msg:'page is not a number'"

# expect: multibyteInClass
# ModSecurity считает байты: `[ёЁ]` — класс из четырёх байтов, а не из двух букв.
SecRule ARGS:name "@rx [ёЁ]" "id:20214,phase:2,pass,nolog"

# expect: withinSubstring
# Список через пробел — не список, а строка: метод `ET` тоже «входит» в неё.
SecRule REQUEST_METHOD "!@within GET POST" "id:20215,phase:1,deny,msg:'Method is not allowed'"

# expect: negatedOnMissing
# Без заголовка правило не исполняется вовсе — и запрос без ключа проходит.
SecRule REQUEST_HEADERS:X-Api-Key "!@streq s3cr3t" "id:20216,phase:1,deny,msg:'Bad API key'"

# expect: strayCharacter
# Неразрывный пробел после имени директивы — след копирования из блога.
SecRule ARGS "@rx a" "id:20217,phase:2,pass,nolog"

# expect: invisibleCharacter
# Символ нулевой ширины внутри шаблона: его не видно, а `admin` не найдётся.
SecRule ARGS "@rx ^ad​min" "id:20218,phase:2,pass,nolog"

# expect: byteOrderMark
# Метка порядка байтов в начале строки: файл склеили из сохранённых с BOM.
﻿SecAction "id:20219,phase:1,pass,nolog"

# expect: markerWithSpace unusedMarker
# Метку с пробелом обе версии ModSecurity не загрузят.
SecMarker "END CHECKS"

# expect: idTooLarge
# Вторая версия читает номер как `int`: больше 2147483647 не бывает.
SecAction "id:4294967296,phase:1,pass,nolog"

# expect: selectorPatternCase
# Coraza сравнивает шаблон по именам параметров с учётом регистра:
# `user_name` она здесь не выберет.
SecRule ARGS:/^User_/ "@rx <script\b" "id:20220,phase:2,pass,nolog"
