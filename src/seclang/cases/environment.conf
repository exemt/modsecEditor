# Окружение: настройки набора, из-за которых правило не работает.
#
# Формат тот же, что в `findings.conf`. Причина здесь всегда в другой
# строке: тело запроса не читается, движок только наблюдает, переменную
# некому заполнить. Поэтому и файл отдельный — переключатели действуют на
# всё, что в нём есть.

# expect: engineNotEnforcing
# В режиме наблюдения блокирующие правила только пишут в журнал.
SecRuleEngine DetectionOnly

# expect: -
SecRequestBodyAccess Off
SecResponseBodyAccess Off

# expect: requestBodyAccessOff
# Тело запроса не разбирается: переменная всегда пуста.
SecRule REQUEST_BODY "@rx ^a1" "id:42001,phase:2,deny,msg:'Blocked'"

# expect: responseBodyAccessOff
SecRule RESPONSE_BODY "@rx ^a2" "id:42002,phase:4,pass"

# expect: requestBodyAccessOff xmlWithoutProcessor
# XML заполняется из тела запроса, и только после включения обработчика.
SecRule XML:/* "@rx ^a3" "id:42003,phase:2,pass"

# expect: geoWithoutLookup
# GEO заполняет оператор @geoLookup, а его в наборе нет.
SecRule GEO:COUNTRY_CODE "@streq RU" "id:42004,phase:1,pass"

# expect: persistentWithoutDataDir
# Коллекции хранятся в каталоге из SecDataDir; без него они живут один запрос.
SecAction "id:42005,phase:1,pass,nolog,initcol:ip=%{REMOTE_ADDR},setvar:ip.hits=+1"

# ---------------------------------------------------------------------
# Значения директив
# ---------------------------------------------------------------------

# expect: directiveValueMissing
SecAuditEngine

# expect: directiveNotNumber
SecRequestBodyLimit abc

# expect: directiveBadValue
SecAuditLogType Parallel

# expect: directiveBadValue
SecDebugLogLevel 12

# expect: directiveUnknownFlag
# В записи журнала аудита нет части X.
SecAuditLogParts ABXZ

# expect: directiveArgCount
# Директива без аргументов — и лишнее слово после неё.
SecResponseBodyMimeTypesClear now

# expect: directiveArgCount
# Второе значение у переключателя — почти всегда забытые кавычки.
SecAuditEngine RelevantOnly Off

# expect: partialBodyInspection
# Всё, что дальше предела, не проверяется: набить тело — и атака пройдёт.
SecRequestBodyLimitAction ProcessPartial

# expect: includeRelative
# Apache считает этот путь от ServerRoot, третья версия и Coraza — от файла.
Include conf.d/extra.conf
