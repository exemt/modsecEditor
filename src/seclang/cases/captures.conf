# Захват: кто заполняет TX.0…TX.9 и кто их читает.
#
# Группа живёт не внутри правила, а до конца запроса: что захватило одно
# правило, прочитает любое, которое исполнится позже. Поэтому блоки здесь
# стоят в значимом порядке — так же, как правила в настоящем наборе, — и
# одно и то же чтение в начале файла и в конце значит разное.
#
# Всё, что здесь утверждается о движках, проверено на стенде: сценарии
# `capture-…` в `scripts/engines/scenarios.json`.
#
# Формат пометок — как в `clean.conf`.

# expect: groupNeverCaptured
# Выше ничто ничего не захватывает: в TX.1 пусто, и правило не сработает.
SecRule TX:1 "@streq admin" "id:60001,phase:1,deny,status:403,log,msg:'Admin area'"

# expect: groupNeverCaptured
# Захват есть, но во второй фазе, а читают в первой: к чтению его ещё нет.
SecRule REQUEST_URI "@rx ^/(\w+)/(\w+)" "id:60002,phase:2,pass,nolog,t:none,capture,setvar:tx.section=%{TX.2}"
SecRule TX:2 "@streq admin" "id:60003,phase:1,deny,status:403,log,msg:'Admin section'"

# expect: -
# «Захватил в одном правиле — проверил в другом»: приём, а не ошибка.
# Читать чужую группу областью проверки или аргументом оператора можно
# только нарочно.
SecRule REQUEST_HEADERS:Host "@rx ^([a-z0-9.-]+)" "id:60004,phase:1,pass,nolog,t:none,t:lowercase,capture"
SecRule TX:1 "@endsWith .internal" "id:60005,phase:1,deny,status:403,log,msg:'Internal host requested'"
SecRule REQUEST_HEADERS:X-Forwarded-Host "!@streq %{TX.1}" "id:60006,phase:1,deny,status:403,log,t:none,t:lowercase,msg:'Host header mismatch'"

# expect: groupFromEarlierRule
# А здесь группа выдаёт себя за находку правила: в журнал попадёт не то,
# что нашёл `@contains`, а хост из правила 60004 — если оно совпало.
SecRule ARGS "@contains ../" "id:60007,phase:2,deny,status:403,log,t:none,t:urlDecodeUni,msg:'Path traversal',logdata:'%{TX.1}'"

# expect: captureMissing
# Оператор группу нашёл бы, но `capture` рядом с ним нет: читается чужое.
SecRule ARGS:login "@rx ^(admin|root)$" "id:60008,phase:2,deny,status:403,log,t:none,t:lowercase,msg:'Privileged login',logdata:'%{TX.1}'"

# expect: captureMissing
# `@pm` при `capture` кладёт найденное слово в TX.0 — но только при нём.
SecRule REQUEST_HEADERS:User-Agent "@pm nikto sqlmap" "id:60009,phase:1,deny,status:403,log,t:none,t:lowercase,msg:'Scanner',logdata:'%{TX.0}'"

# expect: -
# Цепочка: голова захватывает, звено читает — и областью, и аргументом.
SecRule REQUEST_HEADERS:Referer "@rx ^https?://([^/]+)" "id:60010,phase:1,deny,status:403,log,t:none,t:lowercase,capture,msg:'Foreign referer',chain"
    SecRule TX:1 "!@endsWith example.com" "chain"
    SecRule REQUEST_HEADERS:Host "!@streq %{TX.1}" "t:none,t:lowercase"

# expect: -
# `capture` стоит в звене, там же, где шаблон: он действует на своё условие.
# `logdata` головы раскрывается, когда совпала вся цепочка, и группу видит.
SecRule REQUEST_METHOD "@streq POST" "id:60011,phase:2,deny,status:403,log,t:none,msg:'Sensitive path posted',logdata:'%{TX.1}',chain"
    SecRule ARGS:path "@rx ^/(etc|proc)/" "t:none,t:urlDecodeUni,t:normalisePath,capture"

# expect: captureWithoutRegex captureMissing
# `capture` в голове до оператора звена не достаёт: `@streq` захватывать
# нечем, а `@rx` без своего `capture` ничего не сохранит.
SecRule REQUEST_METHOD "@streq POST" "id:60012,phase:2,deny,status:403,log,t:none,capture,msg:'Sensitive path posted',chain"
    SecRule ARGS:path "@rx ^/(etc|proc)/" "t:none,t:urlDecodeUni,t:normalisePath,setvar:tx.dir=%{TX.1}"

# expect: capturingGroupUnused
# Голова захватывает своё совпадение, и `%{TX.0}` — оно. А группа звена
# без своего `capture` считается и выбрасывается: `capture` головы на
# оператор звена не действует.
SecRule REQUEST_HEADERS:Content-Type "@rx ^multipart/" "id:60013,phase:2,deny,status:403,log,t:none,t:lowercase,capture,msg:'Sensitive path uploaded',logdata:'%{TX.0}',chain"
    SecRule ARGS:path "@rx ^/(etc|proc)/" "t:none,t:urlDecodeUni,t:normalisePath"

# expect: groupFromEarlierRule
# Действие головы исполняется, когда совпала голова, — раньше, чем звено
# успеет что-то захватить: в tx.dir уйдёт группа правила выше.
SecRule REQUEST_METHOD "@streq PUT" "id:60014,phase:2,pass,nolog,t:none,setvar:tx.dir=%{TX.1},chain"
    SecRule ARGS:path "@rx ^/(etc|proc)/" "t:none,t:urlDecodeUni,t:normalisePath,capture,setvar:tx.dir_seen=%{TX.1}"

# expect: groupNeverCaptured
# Захват есть, а группы с таким номером в шаблоне нет: скобок две.
SecRule REQUEST_LINE "@rx ^(\w+) (\S+)" "id:60015,phase:2,pass,nolog,t:none,capture,setvar:tx.proto=%{TX.3}"

# expect: -
# Группу выставили руками — захват тут ни при чём.
SecAction "id:60016,phase:2,pass,nolog,setvar:tx.5=fallback"
SecRule TX:5 "@streq fallback" "id:60017,phase:2,pass,nolog,t:none,setvar:tx.used_fallback=1"

# expect: captureUnused
# Ниже группы никто не читает — ни это правило, ни следующие.
SecRule ARGS:token "@rx ^([a-f0-9]{32})$" "id:60018,phase:5,pass,nolog,t:none,capture"
