name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Не `npm ci`: lock-файл собирается на Windows, а npm не записывает в него
      # транзитивные зависимости wasm-биндингов, нужные на Linux (@emnapi/runtime).
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      - run: npm test

      - run: npm run build
